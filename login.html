<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Forge || login</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/styele.css">
    <link rel="icon" href="image/icon.jpg">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="brand">Alpha Forge</a>
                <nav>
                    <ul id="links">
                        <li><a href="login.html">Sing In</a></li>
                        <li><a href="register.html">Sing UP</a></li>
                    </ul>
                    <UL id="user-info">
                        <li><a href="#" id="user"></a></li>
                    </UL>
                </nav>
            </div>
        </div>
    </header>
    <section class="section-form">
        <h2>Login Page</h2>
        <form>
            <input type="text" placeholder="Enter Your UserName" id="username">
            <div class="box">
                <input type="password" placeholder="Enter Your password" id="password">
                <input type="checkbox" id="show">
                <label for="show" class="eye1"><i class="fa-regular fa-eye"></i></label>
                <label for="show" class="eye2"><i class="fa-regular fa-eye-slash"></i></label>
            </div>
            <input type="submit" id="sign-In">
        </form>
    </section>
    <script src="js/login.js"></script>
</body>

</html>
